[project]
name = "scene-review-tool"
version = "0.1.0"
description = "Local UI for remote-sensing image-mask review and scene selection."
requires-python = ">=3.11"
dependencies = [
  "PySide6",
  "Pillow",
  "numpy",
  "openpyxl",
]

[project.scripts]
scene-review-tool = "scene_review_tool.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
