[project]
name = "scene-review-tool"
version = "v1.0"
description = "遥感数据质量审查与场景人工精选软件 v1.0"
requires-python = ">=3.11"
dependencies = [
  "PySide6",
  "Pillow",
  "numpy",
  "openpyxl",
]

[project.scripts]
scene-review-tool = "scene_review_tool.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
